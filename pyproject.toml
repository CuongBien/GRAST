[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "grast"
version = "0.1.0"
description = "From-scratch language model research: confidence reliability and test-time compute."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
cpu = ["torch==2.9.1"]
cuda = ["torch==2.9.1"]
data = ["pyarrow>=20,<25"]

[project.scripts]
grast = "llm_scratch.cli:main"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.urls]
Repository = "https://github.com/CuongBien/GRAST"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_scratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
