# WP07.6.1: validation-only feasibility, frozen before generation/training.
schema_version = 1

[experiment]
name = "wp07-6-1-reasoning-feasibility"

[reproducibility]
seed = 42
deterministic = true
num_threads = 1

[artifacts]
root = "../../artifacts/runs"

[checkpoint]
path = "../../artifacts/checkpoints/wp07-cot-sft-math-500/final.pt"
sha256 = "5f75909261c79e9f7f0c6e37a7e9d76ba5670be8b4be5133b6e148e0cd06ff42"

[coverage]
