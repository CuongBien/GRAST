schema_version = 1
fixture = "../../experiments/wp05_overfit_fixture.json"

[experiment]
name = "wp05-acceptance"
phase = 1

[reproducibility]
seed = 42
deterministic = true
num_threads = 1

[artifacts]
root = "../../artifacts/runs"

[profiles.tiny]
model_config = "../model/overfit_tiny.toml"
learning_rate = 0.003

[profiles.candidate]
model_config = "../model/draft_35m.toml"
learning_rate = 0.001

[tokenizer]
fixture_vocab_size = 280
min_frequency = 1

[optimization]
steps = 200
betas = [0.9, 0.95]
weight_decay = 0.0
max_grad_norm = 1.0

[acceptance]
max_loss_ratio = 0.2
min_token_accuracy = 0.95
