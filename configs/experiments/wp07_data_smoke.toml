schema_version = 1

[experiment]
name = "wp07-2-data-resume"

[profiles]
tiny = "../model/overfit_tiny.toml"
candidate = "../model/draft_35m.toml"

[training]
stage = "pretrain"
max_steps = 4
gradient_accumulation_steps = 2
learning_rate = 0.0003
weight_decay = 0.1
warmup_steps = 1
min_lr_ratio = 0.1
max_grad_norm = 1.0
precision = "float32"

[data]
block_size = 32
batch_size = 2
shuffle_seed = 42
validation_batches = 2

[diagnostic]
checkpoint_step = 2
dropout = 0.1

[reproducibility]
seed = 42
deterministic = true
num_threads = 1

[artifacts]
root = "../../artifacts/runs"
